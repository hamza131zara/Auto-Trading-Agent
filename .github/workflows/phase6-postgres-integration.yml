name: Phase 6 PostgreSQL integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase6-postgres-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-tls-integration:
    name: PostgreSQL TLS trust, hostname and downgrade verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install repository dependencies from the lockfile
        run: npm ci --ignore-scripts

      - name: Install pinned test-only PostgreSQL driver
        run: npm install --no-save --package-lock=false --ignore-scripts --no-fund pg@8.23.1

      - name: Create disposable TLS certificates and PostgreSQL fixtures
        run: bash scripts/phase6-postgres-tls-fixtures.sh

      - name: Verify PostgreSQL and provider trust-registry HTTPS TLS handshakes
        env:
          REQUIRE_PG_TLS_INTEGRATION: "true"
          REQUIRE_PROVIDER_TRUST_REGISTRY_HTTPS_TLS_INTEGRATION: "true"
          PG_TLS_CERT_DIR: ${{ runner.temp }}/ata-pg-tls
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/ata-pg-tls/ca.crt
        run: |
          npm run build
          npm run test:postgres:tls
          node --test test/provider-trust-registry-https-transport.tls.integration.test.mjs

      - name: Remove disposable PostgreSQL TLS fixtures and test keys
        if: always()
        run: |
          docker rm --force ata-pg-tls-valid ata-pg-tls-expired ata-pg-tls12-only ata-pg-plaintext >/dev/null 2>&1 || true
          sudo rm -rf "${RUNNER_TEMP}/ata-pg-tls"

  postgres-integration:
    name: PostgreSQL persistence, backup/restore and migration recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: ata_test
          POSTGRES_PASSWORD: ata_local_test_only
          POSTGRES_DB: ata_phase6_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ata_test -d ata_phase6_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install repository dependencies from the lockfile
        run: npm ci --ignore-scripts

      - name: Install pinned test-only PostgreSQL driver
        run: npm install --no-save --package-lock=false --ignore-scripts --no-fund pg@8.23.1

      - name: Run real PostgreSQL integration tests
        env:
          PG_INTEGRATION_URL: postgres://ata_test:ata_local_test_only@127.0.0.1:5432/ata_phase6_test
          REQUIRE_PG_INTEGRATION: "true"
        run: npm run test:postgres

      - name: Verify test-only node-postgres pool lifecycle behavior
        env:
          PG_INTEGRATION_URL: postgres://ata_test:ata_local_test_only@127.0.0.1:5432/ata_phase6_test
          REQUIRE_PG_POOL_LIFECYCLE_INTEGRATION: "true"
        run: npm run test:postgres:lifecycle
      - name: Run backup/restore and interrupted-migration recovery drill
        env:
          PG_INTEGRATION_URL: postgres://ata_test:ata_local_test_only@127.0.0.1:5432/ata_phase6_test
          REQUIRE_PG_RECOVERY_INTEGRATION: "true"
          PG_BACKUP_RESTORE_IMAGE: postgres:18.6
        run: npm run test:postgres:recovery

      - name: Audit locked repository dependencies
        run: npm audit --audit-level=high
